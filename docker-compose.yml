services:
  xianwai:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        WITH_ASR: ${WITH_ASR:-true}
    image: xianwai:latest
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/data        # 数据库、音频、自定义分析器
      - ./models:/models    # FunASR 模型缓存，避免重复下载
    restart: unless-stopped
