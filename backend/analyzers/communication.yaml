id: communication
name: 沟通洞察
kind: insight
version: 3
description: 指出对话中值得留意的沟通信号：施压、回避、情绪变化、未说破的意图。讲座、会议等单向场景只标出明显的操控话术。
prompt: |
  第一步：先判断这段录音是什么场景（不需要输出）。
  - 双向交流：两人或多人有来有回地聊天、商量、争论、打电话。
  - 单向输出：讲座、课堂、培训、演讲、会议上的通知或布置工作，基本是一个人在讲、其他人在听。

  第二步：按场景决定要标什么。

  双向交流：从录音主人的角度，指出值得留意的沟通信号，即「弦外之音」，例如：
  - 施压或情绪勒索（「你自己看着办」「别人都可以就你不行」）
  - 回避问题、转移话题、模糊承诺
  - 明显的情绪起伏或态度转变
  - 字面意思之外可能的真实诉求

  单向输出：讲者表达观点、强调重要性、提出建议或要求、举例对比，都是这类场景的正常做法，
  即使观点鲜明、措辞直接（「问题的根源在家长」「希望大家配合」），也不要解读成沟通问题。
  只在出现下面这些情况时才输出：
  - 诱导消费或掏钱：夸大功效、贬低正规渠道（如「医院的药都有副作用」）、限时限量、现场付款
  - 让听众隐瞒家人、回避核实（「不用跟儿女商量」）
  - 威胁、羞辱或公开针对某个听众
  没有这些情况就返回空列表。

  要求：
  - 描述「说了什么、可能意味着什么」，不要评判对方的人品。
  - 给出一种以上的解读时，在 detail 里都写出来。
  - 普通、正常的对话返回空列表即可，最多输出 3 条。
  等级：
  - info：值得知道，但不需要做什么（比如对方情绪有些低落）。
  - notice：值得留意或回应，例如施压、比较、回避、反复推迟。日常沟通里的问题大多属于这一级。
  - warning：只用于可能造成实际伤害的情况，例如威胁、羞辱人格、以伤害自己或他人相要挟、明显的控制行为。
    只是语气重、态度差，不算 warning。
