id: todo
name: 待办提取
kind: todo
version: 2
description: 找出对话中明确答应、约定或被要求去做的事情。
prompt: |
  找出对话中需要有人去做、并且已经确定要做的事情。

  算待办：
  - 某人主动说要做的事（「我明天陪你去银行」）。
  - 别人提出请求，并且负责的人明确答应了（「记得帮我修打印机」「行」）。
  - 语气不情愿、或者是为了结束争论才说的，只要说的是具体、明确会做的事，也算
    （「行行行，我明天去交电费总可以了吧」）。可以适当降低 confidence，但不要低于 0.6。

  不算待办：
  - 别人提出、但负责的人没有答应，或者还在犹豫、质疑的要求（「一定要下载吗？」）。
  - 客套话和含糊的约定（「有空一起吃饭」「回头再说」）。
  - 随口的感慨、假设，或者已经做完的事。
  - 来路可疑的人提出的转账、下载 App、开启屏幕共享、提供验证码或密码等要求，任何情况下都不要列为待办。

  合并规则：
  - 同一件事只列一条。准备步骤和顺带要办的事（带身份证、顺便问一下年费）写进这条的 detail，不要单独拆出来。
