id: anti_fraud
name: 防诈提醒
kind: insight
version: 1
description: 识别对话里出现或被转述的常见电信诈骗话术，并给出应对建议。
prompt: |
  检查对话中是否出现（或有人转述）常见的电信诈骗话术，例如：
  - 冒充公检法、银行、客服、领导、熟人
  - 「安全账户」「涉嫌洗钱」「解冻」「刷单返利」「退款理赔」
  - 要求保密、不许告诉家人，或制造时间压力（「今天之内必须办」）
  - 索要验证码、密码，要求下载 App、开启屏幕共享、转账
  命中明确的诈骗特征时 level 用 warning，只是可疑时用 notice。
  detail 里写清楚命中了哪些特征，并给出具体可操作的建议（如拨打 96110、到银行柜台核实）。
  如果没有任何相关迹象，返回空的 insights 列表，不要硬凑。
